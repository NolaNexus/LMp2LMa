# PIPELINE DEFINITION
# Name: ml-training-pipeline
# Description: End-to-end ML training pipeline with Kubeflow
# Inputs:
#    accuracy_threshold: float [Default: 0.7]
#    max_depth: int [Default: 10.0]
#    mlflow_tracking_uri: str [Default: 'sqlite:///mlflow.db']
#    model_name: str [Default: 'rf_classifier']
#    n_estimators: int [Default: 100.0]
#    random_state: int [Default: 42.0]
#    test_size: float [Default: 0.2]
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        accuracy_threshold:
          defaultValue: 0.7
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-prepare-data:
    executorLabel: exec-prepare-data
    inputDefinitions:
      parameters:
        random_state:
          parameterType: NUMBER_INTEGER
        test_size:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        mlflow_tracking_uri:
          parameterType: STRING
        model_name:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          parameterType: NUMBER_INTEGER
        mlflow_tracking_uri:
          parameterType: STRING
        n_estimators:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'numpy' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    test_data: Input[Dataset],\n    model: Input[Model],\n\
          \    metrics: Output[Metrics],\n    accuracy_threshold: float = 0.7,\n):\n\
          \    import pandas as pd\n    import joblib\n    import os\n    from sklearn.metrics\
          \ import accuracy_score, roc_auc_score, classification_report\n\n    df\
          \ = pd.read_csv(test_data.path)\n    X_test = df.drop('target', axis=1)\n\
          \    y_test = df['target']\n\n    model_obj = joblib.load(os.path.join(model.path,\
          \ \"model.joblib\"))\n\n    y_pred = model_obj.predict(X_test)\n    y_prob\
          \ = model_obj.predict_proba(X_test)[:, 1]\n\n    acc = accuracy_score(y_test,\
          \ y_pred)\n    auc = roc_auc_score(y_test, y_prob)\n\n    metrics.log_metric(\"\
          test_accuracy\", acc)\n    metrics.log_metric(\"test_auc\", auc)\n\n   \
          \ print(f\"Test Accuracy: {acc:.4f}, AUC: {auc:.4f}\")\n\n    # Pipeline\
          \ gate: fail if below threshold\n    if acc < accuracy_threshold:\n    \
          \    raise ValueError(f\"Model accuracy {acc:.4f} below threshold {accuracy_threshold}\"\
          )\n\n    print(f\"Model passed quality gate (accuracy >= {accuracy_threshold})\"\
          )\n\n"
        image: python:3.10-slim
        resources:
          cpuLimit: 1.0
          memoryLimit: 2.0
          resourceCpuLimit: '1'
          resourceMemoryLimit: 2G
    exec-prepare-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'numpy'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data(\n    test_size: float,\n    random_state: int,\n\
          \    train_data: Output[Dataset],\n    test_data: Output[Dataset],\n):\n\
          \    import pandas as pd\n    import numpy as np\n    from sklearn.datasets\
          \ import make_classification\n    from sklearn.model_selection import train_test_split\n\
          \n    X, y = make_classification(n_samples=10000, n_features=20, n_informative=15,\
          \ random_state=random_state)\n    X_train, X_test, y_train, y_test = train_test_split(\n\
          \        X, y, test_size=test_size, random_state=random_state, stratify=y\n\
          \    )\n\n    train_df = pd.DataFrame(X_train)\n    train_df['target'] =\
          \ y_train\n    test_df = pd.DataFrame(X_test)\n    test_df['target'] = y_test\n\
          \n    train_df.to_csv(train_data.path, index=False)\n    test_df.to_csv(test_data.path,\
          \ index=False)\n\n    print(f\"Train: {train_df.shape}, Test: {test_df.shape}\"\
          )\n\n"
        image: python:3.10-slim
    exec-register-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow' 'joblib'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(\n    model: Input[Model],\n    mlflow_tracking_uri:\
          \ str,\n    model_name: str,\n    metrics: Input[Metrics],\n):\n    import\
          \ mlflow\n    import joblib\n    import os\n    from mlflow.tracking import\
          \ MlflowClient\n\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n   \
          \ client = MlflowClient()\n\n    # Load metrics\n    import json\n    with\
          \ open(os.path.join(metrics.path, \"metrics.json\"), 'r') as f:\n      \
          \  metrics_data = json.load(f)\n\n    test_acc = metrics_data.get('test_accuracy',\
          \ 0)\n    test_auc = metrics_data.get('test_auc', 0)\n\n    # Register model\n\
          \    model_uri = f\"runs:/{mlflow.active_run().info.run_id}/model\"\n  \
          \  mv = mlflow.register_model(model_uri, model_name)\n\n    # Transition\
          \ to Staging if meets criteria\n    if test_acc >= 0.8 and test_auc >= 0.85:\n\
          \        client.transition_model_version_stage(\n            name=model_name,\n\
          \            version=mv.version,\n            stage=\"Staging\"\n      \
          \  )\n        print(f\"Model {model_name} v{mv.version} promoted to Staging\"\
          )\n    else:\n        print(f\"Model {model_name} v{mv.version} registered\
          \ (not promoted)\")\n\n"
        image: python:3.10-slim
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'numpy' 'mlflow' 'scikit-learn-intelex'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    train_data: Input[Dataset],\n    n_estimators:\
          \ int,\n    max_depth: int,\n    mlflow_tracking_uri: str,\n    model: Output[Model],\n\
          \    metrics: Output[Metrics],\n):\n    import pandas as pd\n    import\
          \ numpy as np\n    import mlflow\n    import mlflow.sklearn\n    from sklearn.ensemble\
          \ import RandomForestClassifier\n    from sklearn.metrics import accuracy_score,\
          \ roc_auc_score\n    import joblib\n    import os\n\n    df = pd.read_csv(train_data.path)\n\
          \    X = df.drop('target', axis=1)\n    y = df['target']\n\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    mlflow.set_experiment(\"kubeflow_pipeline\")\n\n    with mlflow.start_run():\n\
          \        params = {\"n_estimators\": n_estimators, \"max_depth\": max_depth,\
          \ \"random_state\": 42}\n        mlflow.log_params(params)\n\n        model_obj\
          \ = RandomForestClassifier(**params, n_jobs=-1)\n        model_obj.fit(X,\
          \ y)\n\n        # Log to MLflow\n        mlflow.log_param(\"n_estimators\"\
          , n_estimators)\n        mlflow.log_param(\"max_depth\", max_depth)\n  \
          \      mlflow.sklearn.log_model(model_obj, \"model\")\n\n        # Save\
          \ model artifact for KFP\n        joblib.dump(model_obj, os.path.join(model.path,\
          \ \"model.joblib\"))\n\n        train_acc = model_obj.score(X, y)\n    \
          \    metrics.log_metric(\"train_accuracy\", train_acc)\n        mlflow.log_metric(\"\
          train_accuracy\", train_acc)\n\n        print(f\"Model trained: n_estimators={n_estimators},\
          \ max_depth={max_depth}\")\n        print(f\"Train accuracy: {train_acc:.4f}\"\
          )\n\n"
        image: python:3.10-slim
        resources:
          cpuLimit: 2.0
          memoryLimit: 4.0
          resourceCpuLimit: '2'
          resourceMemoryLimit: 4G
pipelineInfo:
  description: End-to-end ML training pipeline with Kubeflow
  name: ml-training-pipeline
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - prepare-data
        - train-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: prepare-data
          parameters:
            accuracy_threshold:
              componentInputParameter: accuracy_threshold
        taskInfo:
          name: evaluate-model
      prepare-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data
        inputs:
          parameters:
            random_state:
              componentInputParameter: random_state
            test_size:
              componentInputParameter: test_size
        taskInfo:
          name: prepare-data
      register-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-model
        dependentTasks:
        - evaluate-model
        - train-model
        inputs:
          artifacts:
            metrics:
              taskOutputArtifact:
                outputArtifactKey: metrics
                producerTask: evaluate-model
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model
          parameters:
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            model_name:
              componentInputParameter: model_name
        taskInfo:
          name: register-model
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - prepare-data
        inputs:
          artifacts:
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: prepare-data
          parameters:
            max_depth:
              componentInputParameter: max_depth
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            n_estimators:
              componentInputParameter: n_estimators
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      accuracy_threshold:
        defaultValue: 0.7
        isOptional: true
        parameterType: NUMBER_DOUBLE
      max_depth:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      mlflow_tracking_uri:
        defaultValue: sqlite:///mlflow.db
        isOptional: true
        parameterType: STRING
      model_name:
        defaultValue: rf_classifier
        isOptional: true
        parameterType: STRING
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      random_state:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      test_size:
        defaultValue: 0.2
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
