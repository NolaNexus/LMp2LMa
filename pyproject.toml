[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-architect-journey"
version = "0.1.0"
description = "Learning workspace for the ML Programmer to ML Architect Aspire Journey"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebook cells are fragments that reference cross-cell globals; skip them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "notebook: notebook structural validation",
    "slow: slow-running notebook execution tests",
]
testpaths = ["tests"]
addopts = "-ra"

[tool.nbstripout]
extra_keys = ["metadata.kernelspec"]