name: ML Architect Assessment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu \
          -r requirements-ci.txt -r requirements-assessment.txt

    - name: Validate notebook structure
      run: python tools/validate_notebooks.py

    - name: Validate checkpoint JSON structure
      run: |
        python -c "
        import json, sys
        from pathlib import Path
        errors = []
        for cp_file in Path('checkpoints').glob('*.json'):
            try:
                with open(cp_file) as f:
                    data = json.load(f)
                assert 'track' in data
                assert 'checkpoints' in data
                assert 'final_exam' in data
                for cp in data['checkpoints']:
                    assert 'id' in cp
                    assert 'notebook' in cp
                    assert 'skills' in cp
                    assert 'questions' in cp
            except Exception as e:
                errors.append(f'{cp_file}: {e}')
        if errors:
            print('Checkpoint validation failed:', file=sys.stderr)
            for e in errors:
                print(f'  - {e}', file=sys.stderr)
            sys.exit(1)
        print('All checkpoints valid')
        "

    - name: Run unit tests
      run: python -m pytest tests/ -v --tb=short -m "not slow" --timeout=120

    - name: Execute fast-subset notebooks
      env:
        QUICK_MODE: "1"
      run: |
        mkdir -p executed
        for nb in \
          track-01-ml-programmer/01_data_preprocessing.ipynb \
          track-01-ml-programmer/02_experiment_tracking.ipynb \
          track-02-dl-programmer/01_nn_fundamentals.ipynb \
          track-02-dl-programmer/02_cnn_vision.ipynb ; do
          track="$(dirname "$nb")"
          mkdir -p "executed/$track"
          python -m nbconvert --to notebook --execute --ExecutePreprocessor.timeout=300 \
            --output-dir "executed/$track" "$nb"
        done

    - name: Run nbval on fast subset
      env:
        QUICK_MODE: "1"
      run: |
        python -m pytest --nbval-lax -v --tb=short --timeout=300 \
          executed/track-01-ml-programmer \
          executed/track-02-dl-programmer

    - name: Run grader on all tracks
      run: |
        set -e
        for track in track_01_ml_programmer track_02_dl_programmer track_03_ml_engineer track_04_ml_architect; do
          echo "=== Grading $track ==="
          python tests/final_exam_grader.py "$track" --json \
            --notebook-dir executed > "grader_output_${track}.json"
          python - <<PY
        import json
        with open("grader_output_${track}.json") as f:
            r = json.load(f)
        print(f"{r['track']}: {r['total_score']}/{r['max_score']} ({r['percentage']}%) - {r['status']}")
        if r["status"] == "ERROR":
            raise SystemExit(1)
        PY
        done

    - name: Upload grader results
      uses: actions/upload-artifact@v4
      with:
        name: grader-results
        path: grader_output_*.json
        retention-days: 7

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const files = fs.readdirSync('.').filter((f) => f.startsWith('grader_output_') && f.endsWith('.json'));
          let comment = '## ML Architect Assessment Results\n\n';
          for (const file of files) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            comment += `**${result.track}**: ${result.total_score}/${result.max_score} (${result.percentage}%) - ${result.status}\n`;
          }
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });