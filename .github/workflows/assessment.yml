# Scoped on purpose: this workflow executes a generated subset, not all 38
# notebooks. The workflow name says so. Structural validation and nbval gate the
# build; the grader runs in report-only mode until checkpoint expectations are
# calibrated (A13), but it no longer treats NOT_EXECUTED as a pass.
# Full-repo execution is `tools/execution_sweep.py` on the GPU machine.
name: ML Architect Assessment (scoped fast subset)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu \
          -r requirements-ci.txt -r requirements-assessment.txt

    - name: Validate notebook structure
      run: python tools/validate_notebooks.py

    - name: Validate checkpoint JSON structure
      run: |
        python -c "
        import json, sys
        from pathlib import Path
        errors = []
        for cp_file in Path('checkpoints').glob('*.json'):
            try:
                with open(cp_file) as f:
                    data = json.load(f)
                assert 'track' in data
                assert 'checkpoints' in data
                assert 'final_exam' in data
                for cp in data['checkpoints']:
                    assert 'id' in cp
                    assert 'notebook' in cp
                    assert 'skills' in cp
                    assert 'questions' in cp
            except Exception as e:
                errors.append(f'{cp_file}: {e}')
        if errors:
            print('Checkpoint validation failed:', file=sys.stderr)
            for e in errors:
                print(f'  - {e}', file=sys.stderr)
            sys.exit(1)
        print('All checkpoints valid')
        "

    - name: Run unit tests
      run: python -m pytest tests/ -v --tb=short -m "not slow" --timeout=120

    - name: Select execution subset (A2)
      run: |
        python tools/execution_subset.py > subset.txt
        echo "--- subset ---"
        cat subset.txt

    - name: Execute subset notebooks
      env:
        QUICK_MODE: "1"
      run: |
        while IFS= read -r nb; do
          track="$(dirname "$nb")"
          mkdir -p "executed/$track"
          python -m nbconvert --to notebook --execute --ExecutePreprocessor.timeout=300 \
            --output-dir "executed/$track" "$nb"
        done < subset.txt

    - name: Run nbval on the subset
      env:
        QUICK_MODE: "1"
      run: |
        mapfile -t executed < <(sed 's|^|executed/|' subset.txt)
        python -m pytest --nbval-lax -v --tb=short --timeout=300 "${executed[@]}"

    - name: Grade the scoped subset (report only, see A13)
      # The grader now exits non-zero for NOT_EXECUTED/FAIL (§0.2). Checkpoint
      # expectations are still placeholders, so this step reports rather than
      # gates until they are calibrated against real outputs (A13).
      continue-on-error: true
      run: |
        while IFS= read -r dir; do
          track="${dir//-/_}"
          echo "=== Grading $track ==="
          out="grader_output_${track}.json"
          python tests/final_exam_grader.py "$track" --json \
            --notebook-dir executed --only-notebooks subset.txt > "$out" || true
          cat "$out"
        done < <(cut -d/ -f1 subset.txt | sort -u)

    - name: Upload grader results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grader-results
        path: |
          subset.txt
          grader_output_*.json
        retention-days: 7

    - name: Comment PR with results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const files = fs.readdirSync('.').filter((f) => f.startsWith('grader_output_') && f.endsWith('.json'));
          let comment = '## ML Architect Assessment Results (scoped fast subset)\n\n';
          for (const file of files) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            comment += `**${result.track}**: ${result.total_score}/${result.max_score} (${result.percentage}%) - ${result.status}\n`;
          }
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
