x-build: &build
  context: .
  dockerfile: .devcontainer/Dockerfile
services:
  cpu-dev:
    build:
      <<: *build
      target: dev
    volumes:
      - .:/workspaces/LMp2LMa
    working_dir: /workspaces/LMp2LMa
    command: bash

  gpu-dev:
    build:
      <<: *build
      target: gpu-dev
    volumes:
      - .:/workspaces/LMp2LMa
    working_dir: /workspaces/LMp2LMa
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dashboard:
    build:
      <<: *build
      target: dev
    volumes:
      - .:/workspaces/LMp2LMa
    working_dir: /workspaces/LMp2LMa
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address=0.0.0.0
